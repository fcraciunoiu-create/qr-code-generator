<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QR Code Generator</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0a0a0f; color: #f5f5f5; min-height: 100vh; padding: 20px 16px 40px; transition: background 0.3s, color 0.3s; }
    body.light { background: #f4f4f8; color: #1c1c1e; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.5px; background: linear-gradient(135deg, #06d6a0, #118ab2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { text-align: center; font-size: 14px; opacity: 0.55; margin-bottom: 22px; }
    .theme-toggle { position: fixed; top: 16px; right: 16px; background: rgba(6, 214, 160, 0.15); border: none; border-radius: 30px; padding: 8px 14px; color: #06d6a0; font-size: 18px; cursor: pointer; z-index: 999; }

    .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: rgba(6, 214, 160, 0.08); border-radius: 14px; padding: 5px; }
    .tab-btn { flex: 1; padding: 9px; border: none; border-radius: 10px; background: transparent; color: #f5f5f5; font-size: 12px; font-weight: 600; cursor: pointer; opacity: 0.55; transition: all 0.2s; }
    body.light .tab-btn { color: #1c1c1e; }
    .tab-btn.active { background: linear-gradient(135deg, #06d6a0, #118ab2); color: #fff; opacity: 1; }

    .input-area { background: rgba(6, 214, 160, 0.05); border: 1px solid rgba(6, 214, 160, 0.15); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
    body.light .input-area { background: rgba(6, 214, 160, 0.08); }
    .input-area label { display: block; font-size: 12px; font-weight: 600; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .input-area input, .input-area textarea {
        width: 100%; background: rgba(6, 214, 160, 0.06); border: 1px solid rgba(6, 214, 160, 0.2); border-radius: 12px;
        padding: 12px 14px; color: #f5f5f5; font-size: 15px; outline: none; font-family: inherit; resize: vertical;
    }
    body.light .input-area input, body.light .input-area textarea { background: #fff; color: #1c1c1e; }
    .input-area input:focus, .input-area textarea:focus { border-color: #06d6a0; }
    .input-area input::placeholder, .input-area textarea::placeholder { color: rgba(245, 245, 245, 0.35); }

    .field { display: none; }
    .field.active { display: block; }
    .field + .field { margin-top: 12px; }

    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .option-group { background: rgba(6, 214, 160, 0.05); border: 1px solid rgba(6, 214, 160, 0.15); border-radius: 14px; padding: 12px; }
    .option-group label { font-size: 11px; font-weight: 600; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    .option-group select { width: 100%; background: rgba(6, 214, 160, 0.08); border: 1px solid rgba(6, 214, 160, 0.2); border-radius: 8px; padding: 8px 10px; color: #f5f5f5; font-size: 13px; outline: none; cursor: pointer; }
    body.light .option-group select { color: #1c1c1e; background: #fff; }

    .generate-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #06d6a0, #118ab2); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.12s; box-shadow: 0 8px 24px rgba(6, 214, 160, 0.3); margin-bottom: 20px; }
    .generate-btn:active { transform: scale(0.97); }

    .qr-result { display: none; text-align: center; background: rgba(6, 214, 160, 0.05); border: 1px solid rgba(6, 214, 160, 0.2); border-radius: 20px; padding: 22px; margin-bottom: 16px; }
    .qr-result.show { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .qr-result img { max-width: 100%; width: 260px; height: 260px; background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 16px; }
    .qr-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .qr-action-btn { padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(6, 214, 160, 0.3); background: rgba(6, 214, 160, 0.08); color: #06d6a0; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .qr-action-btn:active { background: rgba(6, 214, 160, 0.25); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #06d6a0, #118ab2); color: #fff; padding: 12px 22px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 10001; max-width: 90%; text-align: center; box-shadow: 0 8px 24px rgba(6, 214, 160, 0.4); }
</style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <div class="container">
        <h1>QR Code Generator</h1>
        <p class="subtitle">Create QR codes for anything</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="url">🔗 URL</button>
            <button class="tab-btn" data-tab="text">📝 Text</button>
            <button class="tab-btn" data-tab="wifi">📶 WiFi</button>
            <button class="tab-btn" data-tab="email">✉️ Email</button>
        </div>

        <div class="input-area">
            <div class="field active" data-field="url">
                <label>Website URL</label>
                <input type="url" id="urlInput" placeholder="https://example.com">
            </div>
            <div class="field" data-field="text">
                <label>Text Content</label>
                <textarea id="textInput" rows="4" placeholder="Enter any text..."></textarea>
            </div>
            <div class="field" data-field="wifi">
                <label>WiFi Network Name (SSID)</label>
                <input type="text" id="wifiSSID" placeholder="MyNetwork">
                <label style="margin-top: 10px;">Password</label>
                <input type="text" id="wifiPass" placeholder="password123">
            </div>
            <div class="field" data-field="email">
                <label>Email Address</label>
                <input type="email" id="emailTo" placeholder="hello@example.com">
                <label style="margin-top: 10px;">Subject (optional)</label>
                <input type="text" id="emailSubject" placeholder="Hello!">
            </div>
        </div>

        <div class="options">
            <div class="option-group">
                <label>Size</label>
                <select id="sizeSelect">
                    <option value="200">Small (200px)</option>
                    <option value="300" selected>Medium (300px)</option>
                    <option value="500">Large (500px)</option>
                </select>
            </div>
            <div class="option-group">
                <label>Color</label>
                <select id="colorSelect">
                    <option value="000000">Black</option>
                    <option value="118ab2">Blue</option>
                    <option value="06d6a0">Green</option>
                    <option value="ef476f">Pink</option>
                    <option value="073b4c">Dark Teal</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">✨ Generate QR Code</button>

        <div class="qr-result" id="qrResult">
            <img id="qrImage" src="" alt="QR Code">
            <div class="qr-actions">
                <a id="downloadBtn" class="qr-action-btn" download="qrcode.png">⬇️ Download</a>
                <button class="qr-action-btn" id="copyBtn">📋 Copy URL</button>
                <button class="qr-action-btn" id="shareBtn">📤 Share</button>
            </div>
        </div>
    </div>

    <script>
        const THEME_KEY = 'qrGeneratorTheme';
        let currentTab = 'url';
        let currentQRUrl = '';

        function buildQRData() {
            if (currentTab === 'url') {
                const url = document.getElementById('urlInput').value.trim();
                return url ? url : null;
            } else if (currentTab === 'text') {
                const text = document.getElementById('textInput').value.trim();
                return text ? text : null;
            } else if (currentTab === 'wifi') {
                const ssid = document.getElementById('wifiSSID').value.trim();
                const pass = document.getElementById('wifiPass').value.trim();
                if (!ssid) return null;
                return `WIFI:T:WPA;S:${ssid};P:${pass};;`;
            } else if (currentTab === 'email') {
                const to = document.getElementById('emailTo').value.trim();
                const subject = document.getElementById('emailSubject').value.trim();
                if (!to) return null;
                return `mailto:${to}${subject ? '?subject=' + encodeURIComponent(subject) : ''}`;
            }
            return null;
        }

        function generate() {
            const data = buildQRData();
            if (!data) {
                showToast('Please fill in the field first!');
                return;
            }
            const size = document.getElementById('sizeSelect').value;
            const color = document.getElementById('colorSelect').value;
            const url = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(data)}&size=${size}x${size}&color=${color}&bgcolor=FFFFFF&margin=10`;
            currentQRUrl = url;
            const img = document.getElementById('qrImage');
            img.src = url;
            document.getElementById('qrResult').classList.add('show');
            showToast('✅ QR Code generated!');
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('📋 Copied!'))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); showToast('📋 Copied!'); }
            catch (e) { showToast('Copy failed.'); }
            document.body.removeChild(ta);
        }

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.field').forEach(f => f.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                document.querySelector(`[data-field="${currentTab}"]`).classList.add('active');
            });
        });

        document.getElementById('generateBtn').addEventListener('click', generate);

        document.getElementById('copyBtn').addEventListener('click', () => {
            if (currentQRUrl) copyToClipboard(currentQRUrl);
        });

        document.getElementById('shareBtn').addEventListener('click', async () => {
            if (!currentQRUrl) return;
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'QR Code', text: 'Check out this QR code:', url: currentQRUrl });
                    showToast('📤 Shared!');
                } catch (e) {}
            } else {
                copyToClipboard(currentQRUrl);
            }
        });

        // Theme
        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
            try { localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark'); } catch (e) {}
        }

        function loadTheme() {
            try {
                if (localStorage.getItem(THEME_KEY) === 'light') {
                    document.body.classList.add('light');
                    document.getElementById('themeToggle').textContent = '☀️';
                }
            } catch (e) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        });
    </script>
</body>
</html>
